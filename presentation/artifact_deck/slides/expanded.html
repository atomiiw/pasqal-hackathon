<aside>展开后，每个原子前面一个数 a，每对原子前面一个数 b。S 是这个客户到其他所有客户的距离之和，q 是需求，D 是总需求。因为不加 slack bit，原子数是 4/30/60，教科书做法要 14/45/80，L 档正好用满 80 的上限。M/L 档是一车一 bit 的 one-hot，再加每个客户恰好一辆车的惩罚。</aside>
